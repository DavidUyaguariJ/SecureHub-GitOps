apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: daviduyaguarij/securehub-backend:dev-28
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config-dev
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets-dev
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets-dev
                  key: DB_PASSWORD
            - name: RSA_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets-dev
                  key: RSA_PUBLIC_KEY
            - name: RSA_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets-dev
                  key: RSA_PRIVATE_KEY
            - name: Email__Password
              valueFrom:
                secretKeyRef:
                  name: backend-secrets-dev
                  key: EMAIL_PASSWORD
            - name: Keycloak__AdminSecret
              valueFrom:
                secretKeyRef:
                  name: backend-secrets-dev
                  key: KEYCLOAK_ADMIN_SECRET

          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080